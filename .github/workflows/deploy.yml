name: Deploy
on:
  workflow_dispatch:
    inputs:
      deploy_contracts:
        type: boolean
        default: false
        description: Deploy contracts to Stellar testnet
jobs:
  contracts:
    if: inputs.deploy_contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, targets: wasm32v1-none }
      - uses: stellar/stellar-cli@v1
      - run: ./deploy.sh
        env:
          DEPLOYER_IDENTITY: ${{ secrets.STELLAR_DEPLOYER_IDENTITY }}
          TOKEN_ADDRESS: ${{ secrets.STELLAR_TOKEN_ADDRESS }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
